name: BrainDrain CI & Release

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Publish Stable Release (main branch)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(jq -r '.versionName' latest.json)
          RELEASE_NOTES=$(jq -r '.releaseNotes' latest.json)
          TAG_NAME="v${VERSION_NAME}"
          APK_NAME="BrainDrain-${TAG_NAME}.apk"
          
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          
          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists. Uploading updated asset..."
            gh release upload "${TAG_NAME}" "${APK_NAME}" --clobber
          else
            echo "Creating stable release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" "${APK_NAME}" \
              --title "BrainDrain ${TAG_NAME}" \
              --notes "${RELEASE_NOTES}"
          fi

      - name: Publish Beta Pre-Release (develop branch)
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(jq -r '.versionName' latest-beta.json)
          RELEASE_NOTES=$(jq -r '.releaseNotes' latest-beta.json)
          TAG_NAME="v${VERSION_NAME}"
          APK_NAME="BrainDrain-${TAG_NAME}.apk"
          
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          
          if gh release view "${TAG_NAME}" > /dev/null 2>&1; then
            echo "Beta Release ${TAG_NAME} already exists. Uploading updated asset..."
            gh release upload "${TAG_NAME}" "${APK_NAME}" --clobber
          else
            echo "Creating beta pre-release ${TAG_NAME}..."
            gh release create "${TAG_NAME}" "${APK_NAME}" \
              --prerelease \
              --title "BrainDrain ${TAG_NAME} (Beta Channel)" \
              --notes "${RELEASE_NOTES}"
          fi
